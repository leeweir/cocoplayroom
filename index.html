<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fef9ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24211e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="可可的游戏小屋，按玩法找到喜欢的小游戏：经营生活、装扮养成、益智解谜、探索漫游、汽车改装。选一种喜欢的玩法，开始今天的小快乐。" />
    <title>可可的游戏小屋</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/resource-han-rounded-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <!-- 模块和 defer 脚本按文档顺序执行：入口先渲染游戏，统计脚本随后执行。 -->
    <link rel="modulepreload" href="games.js" />
    <link rel="modulepreload" href="analytics.js" />
    <script type="module" src="app.js"></script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="b72a1b50-0b5a-4d61-a9f5-d3878d826048"
      data-domains="leeweir.github.io"
      data-tag="playroom"
      data-exclude-search="true"
      data-exclude-hash="true"
    ></script>
  </head>
  <body>
    <!-- 剪纸风分类图标：主色 --tone、深色 --tone-deep 由 style.css 按分类提供。 -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-all" viewBox="0 0 32 32">
        <path style="fill:var(--tone)" d="M7 15h18v10.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 7 25.5Z" />
        <path style="fill:var(--tone-deep)" d="M3.6 15.2 14.7 5.4a2 2 0 0 1 2.6 0l11.1 9.8a1 1 0 0 1-.7 1.8H4.3a1 1 0 0 1-.7-1.8Z" />
        <rect x="13.5" y="19" width="5" height="9" rx="2.5" fill="#fff8ec" />
        <circle cx="21.8" cy="20.5" r="1.7" fill="#fff8ec" />
      </symbol>
      <symbol id="icon-life" viewBox="0 0 32 32">
        <rect x="17.2" y="2.5" width="2.6" height="11" rx="1.3" transform="rotate(14 18.5 8)" style="fill:var(--tone-deep)" />
        <path style="fill:var(--tone)" d="M8.2 14h15.6l-1.9 12.6a2.2 2.2 0 0 1-2.2 1.9h-7.4a2.2 2.2 0 0 1-2.2-1.9Z" />
        <rect x="6.5" y="10.5" width="19" height="4.5" rx="2.25" style="fill:var(--tone-deep)" />
        <path fill="#fff8ec" opacity=".75" d="M9 17.5h14l-.4 2.6H9.4Z" />
        <circle cx="13" cy="24.6" r="1.4" style="fill:var(--tone-deep)" />
        <circle cx="16.2" cy="25.6" r="1.4" style="fill:var(--tone-deep)" />
        <circle cx="19.2" cy="24.4" r="1.4" style="fill:var(--tone-deep)" />
      </symbol>
      <symbol id="icon-care" viewBox="0 0 32 32">
        <path style="fill:var(--tone-deep)" d="M14.4 17.5 10 27.2l3.2-.8 1.9 2.4 1.6-10.6Zm3.2 0 4.4 9.7-3.2-.8-1.9 2.4-1.6-10.6Z" />
        <path style="fill:var(--tone)" d="M15 16c-3.6-6.4-10.6-7.8-11.2-2.2-.5 5 6.4 6.8 11.2 2.2Zm2 0c3.6-6.4 10.6-7.8 11.2-2.2.5 5-6.4 6.8-11.2 2.2Z" />
        <rect x="13.3" y="12.6" width="5.4" height="6.8" rx="2.4" style="fill:var(--tone-deep)" />
        <ellipse cx="8" cy="13.6" rx="2" ry="1.2" transform="rotate(-20 8 13.6)" fill="#fff8ec" opacity=".6" />
        <ellipse cx="24" cy="13.6" rx="2" ry="1.2" transform="rotate(20 24 13.6)" fill="#fff8ec" opacity=".6" />
      </symbol>
      <symbol id="icon-puzzle" viewBox="0 0 32 32">
        <path style="fill:var(--tone-deep)" d="m19.6 21.8 2.2-2.2 6.6 6.6a1.6 1.6 0 0 1 0 2.2 1.6 1.6 0 0 1-2.2 0Z" />
        <circle cx="13.5" cy="13.5" r="10" style="fill:var(--tone)" />
        <circle cx="13.5" cy="13.5" r="6.6" fill="#fff8ec" />
        <path style="fill:var(--tone)" opacity=".55" d="M9.4 12.6a4.4 4.4 0 0 1 3.4-3.4 1 1 0 0 1 .4 2 2.4 2.4 0 0 0-1.8 1.8 1 1 0 0 1-2-.4Z" />
      </symbol>
      <symbol id="icon-explore" viewBox="0 0 32 32">
        <path style="fill:var(--tone)" d="M16 2.8c-6.6 0-10.6 4.8-10.6 10 0 5 4.6 8.4 7.4 10.2h6.4c2.8-1.8 7.4-5.2 7.4-10.2 0-5.2-4-10-10.6-10Z" />
        <path style="fill:var(--tone-deep)" d="M16 2.8c-3 2.6-4 7-4 10.6 0 3.8 1.2 7.4 2.6 9.6h2.8c1.4-2.2 2.6-5.8 2.6-9.6 0-3.6-1-8-4-10.6Z" />
        <path style="stroke:var(--tone-deep)" fill="none" stroke-width="1.3" stroke-linecap="round" d="m13 23 .8 3m5.2-3-.8 3" />
        <rect x="12.3" y="25.6" width="7.4" height="4.6" rx="1.4" style="fill:var(--tone-deep)" />
      </symbol>
      <symbol id="icon-garage" viewBox="0 0 32 32">
        <path style="fill:var(--tone)" d="M3 20.5c0-2.6 1.6-4.2 4-4.5l2.6-4.8A3.6 3.6 0 0 1 12.8 9.3h6.6a3.6 3.6 0 0 1 3.1 1.8l2.8 4.9c2.4.4 3.7 2 3.7 4.5v2a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 22.5Z" />
        <path fill="#fff8ec" d="M11.4 12.4a1.6 1.6 0 0 1 1.4-.9h6.6a1.6 1.6 0 0 1 1.4.8l1.9 3.6H9.6Z" />
        <circle cx="9.6" cy="24.2" r="3.4" style="fill:var(--tone-deep)" />
        <circle cx="22.4" cy="24.2" r="3.4" style="fill:var(--tone-deep)" />
        <circle cx="9.6" cy="24.2" r="1.2" fill="#fff8ec" />
        <circle cx="22.4" cy="24.2" r="1.2" fill="#fff8ec" />
      </symbol>
      <symbol id="icon-dice" viewBox="0 0 32 32">
        <g transform="rotate(-8 16 16)">
          <rect x="5" y="5" width="22" height="22" rx="6" fill="#fff8ec" />
          <circle cx="11" cy="11" r="2" fill="#3d342b" />
          <circle cx="16" cy="16" r="2" fill="#3d342b" />
          <circle cx="21" cy="21" r="2" fill="#3d342b" />
        </g>
      </symbol>
    </svg>
    <a class="skip-link" href="#games">跳到游戏列表</a>
    <header class="site-header shell">
      <a class="brand" href="./" aria-label="可可的游戏小屋，首页">
        <span class="brand-mark" aria-hidden="true">c</span>
        <span class="brand-name">可可的游戏小屋</span>
      </a>
      <span class="header-note">爸爸做的，每一份小快乐</span>
    </header>

    <main class="shell">
      <section class="welcome" aria-labelledby="welcome-title">
        <img class="welcome-art" src="assets/welcome.webp" alt="小猫和小兔坐在花园里，身旁停着一列小火车" width="880" height="469" />
        <div class="welcome-copy">
          <h1 id="welcome-title">今天，想怎么玩？</h1>
          <p class="welcome-description">当小店长、照顾小猫，或是出发去看看世界。</p>
          <div class="welcome-actions">
            <button class="surprise-button" id="surprise" type="button" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-dice" /></svg>
              帮我选一个
            </button>
            <aside class="recent" id="recent" aria-label="上次玩的游戏" hidden>
              <span class="recent-copy">上次玩了</span>
              <a id="recent-link" href="#games"><img id="recent-image" alt="" width="48" height="36" /><strong id="recent-title"></strong></a>
            </aside>
          </div>
        </div>
      </section>

      <section class="collection" id="games" aria-labelledby="games-title">
        <h2 id="games-title">所有游戏</h2>
        <p class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
        <nav class="category-nav" id="category-nav" aria-label="游戏类型" hidden>
          <ul id="category-links"></ul>
        </nav>
        <div class="game-grid" id="game-groups">
          <p class="loading-message">正在打开游戏小屋…</p>
        </div>
        <noscript>
          <div class="fallback-groups">
            <!-- build: fallback links -->
          </div>
          <style>.loading-message{display:none}</style>
        </noscript>
      </section>
    </main>

    <footer class="site-footer shell">
      <span class="footer-mark" aria-hidden="true">c</span>
      <p>给可可的游戏小屋 <span>每次来，都有小快乐。</span></p>
      <p class="footer-tip">玩一会儿，也记得让眼睛休息一下呀。</p>
    </footer>

    <dialog class="pick-dialog" id="pick-dialog" aria-labelledby="pick-title" aria-describedby="pick-description">
      <button class="close-dialog" id="close-dialog" type="button" aria-label="关闭推荐">×</button>
      <img id="pick-image" alt="" width="800" height="600" />
      <h2 id="pick-title"></h2>
      <p id="pick-description"></p>
      <div class="pick-actions">
        <button id="pick-again" type="button">换一个</button>
        <a id="pick-link" href="#games">就玩这个</a>
      </div>
    </dialog>
  </body>
</html>
